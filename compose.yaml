name: commerce-integration-hub

services:
  postgres:
    image: postgres:18.6
    environment:
      POSTGRES_DB: integration_hub
      POSTGRES_USER: integration_hub
      POSTGRES_PASSWORD: local-development-only
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - integration-hub-postgres:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U integration_hub -d integration_hub"]
      interval: 2s
      timeout: 5s
      retries: 15


  opensearch:
    image: opensearchproject/opensearch:3.8.0
    profiles: ["search"]
    environment:
      discovery.type: single-node
      DISABLE_SECURITY_PLUGIN: "true"
      OPENSEARCH_JAVA_OPTS: -Xms512m -Xmx512m
    ports:
      - "${OPENSEARCH_PORT:-9200}:9200"
    volumes:
      - integration-hub-opensearch:/usr/share/opensearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:9200/_cluster/health >/dev/null"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s

  connector-gateway-postgres:
    image: postgres:18.6
    profiles: ["gateway"]
    environment:
      POSTGRES_DB: connector_gateway
      POSTGRES_USER: connector_gateway
      POSTGRES_PASSWORD: local-development-only
    ports:
      - "${CONNECTOR_GATEWAY_POSTGRES_PORT:-5434}:5432"
    volumes:
      - connector-gateway-postgres:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U connector_gateway -d connector_gateway"]
      interval: 2s
      timeout: 5s
      retries: 15

  connector-gateway-migrate:
    build:
      context: services/connector-gateway
    profiles: ["gateway"]
    command: ["dist/database-migrate.js"]
    environment:
      DATABASE_URL: postgresql://connector_gateway:local-development-only@connector-gateway-postgres:5432/connector_gateway
    depends_on:
      connector-gateway-postgres:
        condition: service_healthy
    restart: "no"

  provider-simulator:
    build:
      context: tools/provider-simulator
    profiles: ["gateway"]
    environment:
      PROVIDER_SIMULATOR_ERP_B_API_TOKEN: local-erp-b-token
      PROVIDER_SIMULATOR_ERP_B_SCENARIO: "${PROVIDER_SIMULATOR_ERP_B_SCENARIO:-MIXED}"
    ports:
      - "${PROVIDER_SIMULATOR_PORT:-8083}:8080"
    healthcheck:
      test:
        - CMD
        - /nodejs/bin/node
        - -e
        - >-
          fetch('http://127.0.0.1:8080/health')
          .then(response => { if (!response.ok) process.exit(1) })
          .catch(() => process.exit(1))
      interval: 2s
      timeout: 5s
      retries: 15
      start_period: 2s

  connector-gateway:
    build:
      context: services/connector-gateway
    profiles: ["gateway"]
    environment:
      DATABASE_URL: postgresql://connector_gateway:local-development-only@connector-gateway-postgres:5432/connector_gateway
      DELIVERY_WORKER_ENABLED: "${CONNECTOR_GATEWAY_DELIVERY_WORKER_ENABLED:-false}"
      DELIVERY_WORKER_ID: connector-gateway-compose
      ERP_B_API_TOKEN: "${CONNECTOR_GATEWAY_ERP_B_API_TOKEN:-local-erp-b-token}"
      ERP_B_BASE_URL: http://provider-simulator:8080
      ERP_B_PAGE_LIMIT: "2"
      ERP_B_POLLING_ENABLED: "${CONNECTOR_GATEWAY_ERP_B_POLLING_ENABLED:-false}"
      ERP_B_POLLING_WORKER_ID: erp-b-poller-compose
      INTEGRATION_CORE_BASE_URL: http://integration-core:8080
      INTEGRATION_CORE_SOURCE_API_KEY: "${INTEGRATION_CORE_SOURCE_API_KEY:-}"
      MARKETPLACE_A_WEBHOOK_CURRENT_KEY_ID: local-key
      MARKETPLACE_A_WEBHOOK_CURRENT_SECRET_BASE64: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
    ports:
      - "${CONNECTOR_GATEWAY_PORT:-8081}:8081"
    depends_on:
      connector-gateway-migrate:
        condition: service_completed_successfully
      provider-simulator:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - /nodejs/bin/node
        - -e
        - >-
          fetch('http://127.0.0.1:8081/health/ready')
          .then(response => { if (!response.ok) process.exit(1) })
          .catch(() => process.exit(1))
      interval: 2s
      timeout: 5s
      retries: 15
      start_period: 2s

  redpanda:
    image: docker.redpanda.com/redpandadata/redpanda:v26.2.1
    command:
      - redpanda
      - start
      - --kafka-addr=internal://0.0.0.0:9092,external://0.0.0.0:19092
      - --advertise-kafka-addr=internal://redpanda:9092,external://localhost:19092
      - --rpc-addr=redpanda:33145
      - --advertise-rpc-addr=redpanda:33145
      - --mode=dev-container
      - --smp=1
      - --default-log-level=info
    ports:
      - "${REDPANDA_KAFKA_PORT:-19092}:19092"
      - "${REDPANDA_ADMIN_PORT:-19644}:9644"
    volumes:
      - integration-hub-redpanda:/var/lib/redpanda/data
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster health | grep -E 'Healthy:.+true' || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  redpanda-init:
    image: docker.redpanda.com/redpandadata/redpanda:v26.2.1
    entrypoint: /bin/sh
    command:
      - -c
      - >
        for topic in
        integration.order.received.v1
        integration.order.ready.v2
        integration.order.received.dlq.v1
        integration.order.ready.search.dlq.v2;
        do
          rpk topic create "$${topic}" --brokers redpanda:9092 --partitions 3 --replicas 1 ||
          rpk topic describe "$${topic}" --brokers redpanda:9092 >/dev/null ||
          exit 1;
        done
    depends_on:
      redpanda:
        condition: service_healthy

  redpanda-console:
    image: docker.redpanda.com/redpandadata/console:v3.10.0
    environment:
      KAFKA_BROKERS: redpanda:9092
      REDPANDA_ADMINAPI_ENABLED: "true"
      REDPANDA_ADMINAPI_URLS: http://redpanda:9644
    ports:
      - "${REDPANDA_CONSOLE_PORT:-8082}:8080"
    depends_on:
      redpanda:
        condition: service_healthy

  integration-core:
    build:
      context: services/integration-core
      dockerfile: src/main/docker/Dockerfile.jvm
    environment:
      DB_JDBC_URL: jdbc:postgresql://postgres:5432/integration_hub
      DB_USERNAME: integration_hub
      DB_PASSWORD: local-development-only
      KAFKA_BOOTSTRAP_SERVERS: redpanda:9092
      OPENSEARCH_URL: http://opensearch:9200
      ORDER_SEARCH_PROJECTION_ENABLED: "${ORDER_SEARCH_PROJECTION_ENABLED:-false}"
      OUTBOX_WORKER_ID: integration-core-compose
      INTEGRATION_HUB_SECURITY_SOURCE_CREDENTIAL_PEPPERS: "1:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA"
    ports:
      - "${INTEGRATION_CORE_PORT:-8080}:8080"
    depends_on:
      opensearch:
        condition: service_healthy
        required: false
      postgres:
        condition: service_healthy
      redpanda-init:
        condition: service_completed_successfully
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          bash -c 'exec 3<>/dev/tcp/127.0.0.1/8080;
          printf "GET /health/ready HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n" >&3;
          grep -q "HTTP/1.1 200" <&3'
      interval: 2s
      timeout: 5s
      retries: 30
      start_period: 5s

  prometheus:
    image: prom/prometheus:v3.14.0
    profiles: ["observability"]
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=24h
    ports:
      - "127.0.0.1:${PROMETHEUS_PORT:-9090}:9090"
    volumes:
      - ./observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus

  grafana:
    image: grafana/grafana:13.2.1
    profiles: ["observability"]
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
      GF_PLUGINS_PREINSTALL_DISABLED: "true"
      GF_USERS_ALLOW_SIGN_UP: "false"
    ports:
      - "127.0.0.1:${GRAFANA_PORT:-3000}:3000"
    volumes:
      - ./observability/grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      - ./observability/grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    depends_on:
      prometheus:
        condition: service_started

volumes:
  connector-gateway-postgres:
  grafana-data:
  integration-hub-postgres:
  integration-hub-opensearch:
  integration-hub-redpanda:
  prometheus-data:
