{{- if .Values.providerSimulator.enabled }}
{{- $simulator := .Values.providerSimulator }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: provider-simulator
  labels:
    app.kubernetes.io/name: provider-simulator
    {{- include "hub.labels" . | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: provider-simulator
  template:
    metadata:
      labels:
        app.kubernetes.io/name: provider-simulator
        {{- include "hub.labels" . | nindent 8 }}
    spec:
      serviceAccountName: provider-simulator
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532 # the images' `nonroot` user, by number
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: provider-simulator
          image: {{ include "hub.image" .Values.images.providerSimulator }}
          imagePullPolicy: {{ .Values.images.pullPolicy }}
          ports:
            - { name: http, containerPort: 8080 }
          env:
            - name: PROVIDER_SIMULATOR_ERP_B_API_TOKEN
              valueFrom: { secretKeyRef: { name: hub-synthetic, key: erpBApiToken } }
            - { name: PROVIDER_SIMULATOR_ERP_B_SCENARIO, value: {{ $simulator.scenario | quote }} }
          readinessProbe:
            httpGet: { path: /health, port: http }
            periodSeconds: 5
          resources:
            {{- toYaml $simulator.resources | nindent 12 }}
          securityContext:
            {{- include "hub.containerSecurity" . | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: provider-simulator
  labels:
    app.kubernetes.io/name: provider-simulator
    {{- include "hub.labels" . | nindent 4 }}
spec:
  selector:
    app.kubernetes.io/name: provider-simulator
  ports:
    - { name: http, port: 8080, targetPort: http }
{{- end }}
