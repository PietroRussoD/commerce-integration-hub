apiVersion: v1
kind: Secret
metadata:
  name: hub-synthetic
  labels:
    {{- include "hub.labels" . | nindent 4 }}
type: Opaque
stringData:
  sourceCredentialPeppers: {{ .Values.synthetic.sourceCredentialPeppers | quote }}
  webhookKeyId: {{ .Values.synthetic.webhookKeyId | quote }}
  webhookSecretBase64: {{ .Values.synthetic.webhookSecretBase64 | quote }}
  erpBApiToken: {{ .Values.synthetic.erpBApiToken | quote }}
