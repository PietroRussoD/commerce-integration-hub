{{- /* One service account per application, so that the mesh can tell them apart. */}}
{{- range $name := list "integration-core" "connector-gateway" "provider-simulator" }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $name }}
  labels:
    app.kubernetes.io/name: {{ $name }}
    {{- include "hub.labels" $ | nindent 4 }}
automountServiceAccountToken: false
{{- end }}
