{{- /* One service account per application, so that the mesh can tell them apart,
and one for the pods of the verification scripts. */}}
{{- range $name := list "integration-core" "connector-gateway" "provider-simulator" "hub-test-client" }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $name }}
  labels:
    app.kubernetes.io/name: {{ $name }}
    {{- include "hub.labels" $ | nindent 4 }}
automountServiceAccountToken: false
{{- end }}
