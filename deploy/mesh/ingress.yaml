# The way in, with Gateway API on Istio. Only the APIs are routed: health and
# metrics endpoints are not reachable from outside.
apiVersion: v1
kind: Namespace
metadata:
  name: hub-ingress
---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: hub-ingress
  namespace: hub-ingress
  annotations:
    # There is no load balancer in kind: reach it with a port-forward.
    networking.istio.io/service-type: ClusterIP
spec:
  gatewayClassName: istio
  listeners:
    - name: http
      port: 80
      protocol: HTTP
      allowedRoutes:
        namespaces:
          from: Selector
          selector:
            matchLabels:
              kubernetes.io/metadata.name: hub
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: hub-apis
  namespace: hub
spec:
  parentRefs:
    - name: hub-ingress
      namespace: hub-ingress
  rules:
    # The longest matching prefix wins, so the Gateway's operator API is not
    # taken by the Core's `/api/v1/`.
    - matches:
        - path: { type: PathPrefix, value: /providers/ }
        - path: { type: PathPrefix, value: /api/v1/operator/deliveries }
      backendRefs:
        - name: connector-gateway
          port: 8081
    - matches:
        - path: { type: PathPrefix, value: /api/v1/ }
      backendRefs:
        - name: integration-core
          port: 8080
