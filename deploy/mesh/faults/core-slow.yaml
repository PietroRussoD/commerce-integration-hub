# Fault injected at the Core's waypoint (scripts/k8s/verify-failures.sh core-slow).
# Every call to the Core takes three seconds longer: deliveries stay in flight, and a Gateway pod killed meanwhile holds leases.
# It replaces the Core's VirtualService; applying deploy/mesh/waypoint.yaml
# restores it. The no-retry policy is kept: the mesh must not retry.
apiVersion: networking.istio.io/v1
kind: VirtualService
metadata:
  name: integration-core
  namespace: hub
spec:
  hosts:
    - integration-core.hub.svc.cluster.local
  http:
    - fault:
        delay:
          percentage: { value: 100 }
          fixedDelay: 3s
      route:
        - destination:
            host: integration-core.hub.svc.cluster.local
            port:
              number: 8080
      retries:
        attempts: 0
