name: Release container image

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read
  packages: write

concurrency:
  group: release-image-${{ github.ref }}
  cancel-in-progress: false

jobs:
  promote-integration-core:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      IMAGE: ghcr.io/pietrorussod/commerce-integration-hub/integration-core

    steps:
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Promote verified image
        run: |
          docker pull "${IMAGE}:latest"

          image_revision="$(docker inspect --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}' "${IMAGE}:latest")"
          if [ "$image_revision" != "$GITHUB_SHA" ]; then
            echo "The latest image was built from $image_revision, not $GITHUB_SHA."
            exit 1
          fi

          docker tag "${IMAGE}:latest" "${IMAGE}:${GITHUB_REF_NAME}"
          docker push "${IMAGE}:${GITHUB_REF_NAME}"
