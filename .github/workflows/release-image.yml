name: Release container image

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read
  packages: write

concurrency:
  group: release-image-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify-release-version:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out repository
        uses: actions/checkout@v6.0.2
        with:
          persist-credentials: false

      - name: Verify that module versions match the release tag
        run: ./scripts/check-module-versions.sh "$GITHUB_REF_NAME"

  promote-images:
    needs: verify-release-version
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        image:
          - integration-core
          - connector-gateway
    env:
      IMAGE: ghcr.io/pietrorussod/commerce-integration-hub/${{ matrix.image }}

    steps:
      - name: Check out repository history
        uses: actions/checkout@v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Promote verified image
        run: |
          docker pull "${IMAGE}:latest"

          image_revision="$(docker inspect --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}' "${IMAGE}:latest")"
          if [ -z "$image_revision" ]; then
            echo "The latest image does not declare an OCI source revision."
            exit 1
          fi
          if ! git merge-base --is-ancestor "$image_revision" "$GITHUB_SHA"; then
            echo "The latest image revision $image_revision is not part of release $GITHUB_SHA."
            exit 1
          fi

          docker tag "${IMAGE}:latest" "${IMAGE}:${GITHUB_REF_NAME}"
          docker push "${IMAGE}:${GITHUB_REF_NAME}"
