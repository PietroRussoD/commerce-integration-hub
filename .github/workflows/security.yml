name: Container security

on:
  schedule:
    - cron: "17 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  packages: read

concurrency:
  group: container-security
  cancel-in-progress: true

jobs:
  scan-published-images:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        image:
          - integration-core
          - connector-gateway

    steps:
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Scan published container image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ghcr.io/pietrorussod/commerce-integration-hub/${{ matrix.image }}:latest
          scanners: vuln
          vuln-type: os,library
          severity: HIGH,CRITICAL
          exit-code: "1"
          ignore-unfixed: "false"
          format: table
          hide-progress: true
          version: v0.74.0
