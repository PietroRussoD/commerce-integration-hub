name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions: {}

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      connector_gateway: ${{ steps.filter.outputs.connector_gateway }}
      integration_core: ${{ steps.filter.outputs.integration_core }}
      operator_console: ${{ steps.filter.outputs.operator_console }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Detect affected applications
        id: filter
        uses: dorny/paths-filter@v4.0.3
        with:
          filters: |
            connector_gateway:
              - "services/connector-gateway/**"
              - "tools/provider-simulator/**"
              - "compose.yaml"
              - ".github/workflows/ci.yml"
            integration_core:
              - "services/integration-core/**"
              - "compose.yaml"
              - ".github/workflows/ci.yml"
            operator_console:
              - "apps/operator-console/**"
              - "services/integration-core/**"
              - ".github/workflows/ci.yml"

      - name: Scan Git history for secrets
        run: >-
          docker run --rm
          --volume "$GITHUB_WORKSPACE:/repo"
          ghcr.io/gitleaks/gitleaks:v8.30.1
          git
          --config /repo/.gitleaks.toml
          --redact=100
          --no-banner
          /repo

  module-versions:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read

    steps:
      - name: Check out repository
        uses: actions/checkout@v6.0.2
        with:
          persist-credentials: false

      - name: Verify that every module declares the same version
        run: ./scripts/check-module-versions.sh

  connector-gateway:
    needs: changes
    if: needs.changes.outputs.connector_gateway == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
    defaults:
      run:
        working-directory: services/connector-gateway

    steps:
      - name: Check out repository
        uses: actions/checkout@v6.0.2
        with:
          persist-credentials: false

      - name: Set up pnpm and Node.js
        uses: pnpm/setup@v2.1.0
        with:
          version: 11.23.0
          runtime: node@24
          cache: true
          cache-dependency-path: |
            services/connector-gateway/pnpm-lock.yaml
            tools/provider-simulator/pnpm-lock.yaml
          package-json-file: services/connector-gateway/package.json
          install: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check connector gateway
        run: pnpm check

      - name: Test connector gateway migrations
        run: pnpm test:integration

      - name: Install provider simulator dependencies
        working-directory: tools/provider-simulator
        run: pnpm install --frozen-lockfile

      - name: Check provider simulator
        working-directory: tools/provider-simulator
        run: pnpm check

      - name: Upload connector gateway coverage
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: connector-gateway-coverage
          path: services/connector-gateway/coverage
          if-no-files-found: warn
          retention-days: 14

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4.3.0

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: connector-gateway-docker-meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/pietrorussod/commerce-integration-hub/connector-gateway
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and optionally push Docker image
        uses: docker/build-push-action@v7
        with:
          context: ./services/connector-gateway
          file: ./services/connector-gateway/Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.connector-gateway-docker-meta.outputs.tags }}
          labels: ${{ steps.connector-gateway-docker-meta.outputs.labels }}
          cache-from: type=gha,scope=connector-gateway
          cache-to: type=gha,mode=max,scope=connector-gateway

  operator-console:
    needs: changes
    if: needs.changes.outputs.operator_console == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    defaults:
      run:
        working-directory: apps/operator-console

    steps:
      - name: Check out repository
        uses: actions/checkout@v6.0.2
        with:
          persist-credentials: false

      - name: Set up pnpm and Node.js
        uses: pnpm/setup@v2.1.0
        with:
          version: 11.23.0
          runtime: node@24
          cache: true
          cache-dependency-path: apps/operator-console/pnpm-lock.yaml
          package-json-file: apps/operator-console/package.json
          install: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify generated API types
        run: pnpm check:api

      - name: Check operator console
        run: pnpm check

      - name: Upload operator console coverage
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: operator-console-coverage
          path: apps/operator-console/coverage
          if-no-files-found: warn
          retention-days: 14

  integration-core:
    needs: changes
    if: needs.changes.outputs.integration_core == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    defaults:
      run:
        working-directory: services/integration-core

    steps:
      - name: Check out repository
        uses: actions/checkout@v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Java
        uses: actions/setup-java@v6.0.1
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
          cache-dependency-path: services/integration-core/pom.xml

      - name: Build
        run: ./mvnw --batch-mode --no-transfer-progress verify

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: integration-core-coverage
          path: services/integration-core/target/site/jacoco
          if-no-files-found: warn
          retention-days: 14

      - name: Upload software bill of materials
        uses: actions/upload-artifact@v7.0.1
        with:
          name: integration-core-sbom
          path: services/integration-core/target/sbom/integration-core.cdx.json
          if-no-files-found: error
          retention-days: 14

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4.3.0

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: docker-meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/pietrorussod/commerce-integration-hub/integration-core
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and optionally push Docker image
        uses: docker/build-push-action@v7
        with:
          context: ./services/integration-core
          file: ./services/integration-core/src/main/docker/Dockerfile.jvm
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.docker-meta.outputs.tags }}
          labels: ${{ steps.docker-meta.outputs.labels }}
          cache-from: type=gha,scope=integration-core
          cache-to: type=gha,mode=max,scope=integration-core
