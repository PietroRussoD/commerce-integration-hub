name: CI

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:

permissions:
  contents: read
  packages: write

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  integration-core:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/integration-core

    steps:
      - name: Check out repository
        uses: actions/checkout@v6.0.2

      - name: Set up Java
        uses: actions/setup-java@v5.6.0
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: services/integration-core/pom.xml

      - name: Build
        run: ./mvnw --batch-mode --no-transfer-progress verify

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: integration-core-coverage
          path: services/integration-core/target/site/jacoco
          if-no-files-found: warn

      - name: Upload software bill of materials
        uses: actions/upload-artifact@v7.0.1
        with:
          name: integration-core-sbom
          path: services/integration-core/target/sbom/integration-core.cdx.json
          if-no-files-found: error
          retention-days: 14

      - name: Build image for vulnerability scan
        run: >-
          docker build
          --file src/main/docker/Dockerfile.jvm
          --tag integration-core:security-scan
          .

      - name: Scan container image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: integration-core:security-scan
          scanners: vuln
          vuln-type: os,library
          severity: HIGH,CRITICAL
          exit-code: "1"
          ignore-unfixed: "false"
          format: table
          hide-progress: true
          version: v0.74.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4.1.0

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: docker-meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/pietrorussod/commerce-integration-hub/integration-core
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=tag

      - name: Build and optionally push Docker image
        uses: docker/build-push-action@v7
        with:
          context: ./services/integration-core
          file: ./services/integration-core/src/main/docker/Dockerfile.jvm
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.docker-meta.outputs.tags }}
          labels: ${{ steps.docker-meta.outputs.labels }}
