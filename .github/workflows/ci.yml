name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  integration-core:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/integration-core

    steps:
      - name: Check out repository
        uses: actions/checkout@v6.0.2

      - name: Set up Java
        uses: actions/setup-java@v5.6.0
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: services/integration-core/pom.xml

      - name: Build
        run: ./mvnw --batch-mode --no-transfer-progress verify
