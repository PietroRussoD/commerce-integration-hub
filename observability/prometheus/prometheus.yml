global:
  scrape_interval: 5s
  scrape_timeout: 4s
  evaluation_interval: 15s

scrape_configs:
  - job_name: integration-core
    metrics_path: /metrics
    static_configs:
      - targets: ["integration-core:8080"]

  - job_name: connector-gateway
    metrics_path: /metrics
    static_configs:
      - targets: ["connector-gateway:8081"]
