# Non-production authentication material used only by integration tests.
integration-hub.security.source-credential-peppers=1:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA

# Broker-backed tests enable Kafka Dev Services explicitly; component tests use the in-memory connector.
quarkus.kafka.devservices.enabled=false
mp.messaging.incoming.order-received-in.connector=smallrye-in-memory
mp.messaging.outgoing.integration-events-out.connector=smallrye-in-memory

# Scheduled jobs are invoked explicitly by their integration tests.
quarkus.scheduler.enabled=false
