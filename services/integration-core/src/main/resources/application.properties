# HTTP
quarkus.http.non-application-root-path=/
quarkus.jackson.fail-on-unknown-properties=true
quarkus.rest.exception-mapping.disable-mapper-for=io.quarkus.resteasy.reactive.jackson.runtime.mappers.BuiltinMismatchedInputExceptionMapper

# Operator authentication
quarkus.oidc.tenant-enabled=${OPERATOR_OIDC_ENABLED:false}
quarkus.oidc.application-type=service
quarkus.oidc.auth-server-url=${OPERATOR_OIDC_AUTH_SERVER_URL:http://localhost:8180/realms/integration-hub}
quarkus.oidc.client-id=${OPERATOR_OIDC_AUDIENCE:integration-hub-operator-api}
quarkus.oidc.token.audience=${OPERATOR_OIDC_AUDIENCE:integration-hub-operator-api}
quarkus.oidc.token.issuer=${OPERATOR_OIDC_ISSUER:https://identity.example.invalid/realms/integration-hub}
quarkus.oidc.token.signature-algorithm=RS256
quarkus.oidc.token.allow-jwt-introspection=false
quarkus.oidc.token.lifespan-grace=${OPERATOR_OIDC_CLOCK_SKEW_SECONDS:30}
quarkus.oidc.roles.role-claim-path=groups
quarkus.http.auth.permission.operator-api.enabled=${OPERATOR_AUTHORIZATION_ENABLED:false}
quarkus.http.auth.permission.operator-api.paths=/api/v1/operator/*
quarkus.http.auth.permission.operator-api.auth-mechanism=bearer
quarkus.http.auth.permission.operator-api.policy=operator-access
quarkus.http.auth.policy.operator-access.roles-allowed=operator,platform-admin

# Logging
quarkus.log.console.filter=operator-oidc
quarkus.log.console.format=%d{yyyy-MM-dd HH:mm:ss,SSS} %-5p [%c{3.}] (%t) %s mdc=%X%e%n
quarkus.log.console.json.enabled=true
%dev.quarkus.log.console.json.enabled=false
%test.quarkus.log.console.json.enabled=false

# OpenTelemetry
quarkus.otel.sdk.disabled=true
%prod.quarkus.otel.sdk.disabled=${OTEL_SDK_DISABLED:true}
%prod.quarkus.otel.exporter.otlp.endpoint=${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:4317}

# Database
quarkus.datasource.db-kind=postgresql
quarkus.datasource.devservices.image-name=docker.io/library/postgres:18.3
quarkus.flyway.migrate-at-start=true
quarkus.jooq.dialect=POSTGRES
%prod.quarkus.datasource.jdbc.url=${DB_JDBC_URL}
%prod.quarkus.datasource.username=${DB_USERNAME}
%prod.quarkus.datasource.password=${DB_PASSWORD}
# A database that stops answering without closing its connections (a lost node, a
# network partition) must make a call fail, not wait for ever: without these the
# driver never times out, and the worker threads that publish the outbox and
# consume Kafka stay blocked until the pod is restarted. pgjdbc reads both
# timeouts in seconds; no query of the Core runs for anywhere near thirty.
%prod.quarkus.datasource.jdbc.additional-jdbc-properties.connectTimeout=${DB_CONNECT_TIMEOUT_SECONDS:5}
%prod.quarkus.datasource.jdbc.additional-jdbc-properties.socketTimeout=${DB_SOCKET_TIMEOUT_SECONDS:30}
%prod.quarkus.datasource.jdbc.additional-jdbc-properties.tcpKeepAlive=true

# Outbox
quarkus.scheduler.metrics.enabled=true
integration-hub.outbox.dispatch.interval=1s
integration-hub.outbox.dispatch.batch-size=5
integration-hub.outbox.worker-id=${OUTBOX_WORKER_ID:integration-core}
integration-hub.outbox.recovery.interval=30s
integration-hub.outbox.recovery.claim-timeout=2m
integration-hub.outbox.recovery.batch-size=100
integration-hub.outbox.retry.base-delay=10s
integration-hub.outbox.retry.maximum-delay=5m
integration-hub.outbox.retry.maximum-attempts=5
integration-hub.outbox.metrics.interval=15s

# Order search reconciliation
integration-hub.order-search.reconciliation.enabled=${ORDER_SEARCH_RECONCILIATION_ENABLED:false}
integration-hub.order-search.reconciliation.interval=30s
integration-hub.order-search.reconciliation.batch-size=100
integration-hub.order-search.reconciliation.worker-id=${ORDER_SEARCH_RECONCILIATION_WORKER_ID:integration-core}
integration-hub.order-search.reconciliation.lease-duration=2m

# Kafka
integration-hub.kafka.topics.order-received=integration.order.received.v1
integration-hub.kafka.topics.order-ready=integration.order.ready.v2
mp.messaging.incoming.order-received-in.connector=smallrye-kafka
mp.messaging.incoming.order-received-in.topic=${integration-hub.kafka.topics.order-received}
mp.messaging.incoming.order-received-in.group.id=integration-core-order-processor
mp.messaging.incoming.order-received-in.key.deserializer=org.apache.kafka.common.serialization.StringDeserializer
mp.messaging.incoming.order-received-in.enable.auto.commit=false
mp.messaging.incoming.order-received-in.commit-strategy=throttled
mp.messaging.incoming.order-received-in.auto.offset.reset=earliest
mp.messaging.incoming.order-received-in.failure-strategy=dead-letter-queue
mp.messaging.incoming.order-received-in.fail-on-deserialization-failure=false
mp.messaging.incoming.order-received-in.dead-letter-queue.topic=integration.order.received.dlq.v1
mp.messaging.incoming.order-received-in.dead-letter-queue.key.serializer=org.apache.kafka.common.serialization.StringSerializer
mp.messaging.incoming.order-received-in.dead-letter-queue.value.serializer=io.quarkus.kafka.client.serialization.ObjectMapperSerializer
mp.messaging.incoming.order-ready-search-in.enabled=${ORDER_SEARCH_PROJECTION_ENABLED:false}
mp.messaging.incoming.order-ready-search-in.connector=smallrye-kafka
mp.messaging.incoming.order-ready-search-in.topic=${integration-hub.kafka.topics.order-ready}
mp.messaging.incoming.order-ready-search-in.group.id=integration-core-order-search-projection
mp.messaging.incoming.order-ready-search-in.key.deserializer=org.apache.kafka.common.serialization.StringDeserializer
mp.messaging.incoming.order-ready-search-in.enable.auto.commit=false
mp.messaging.incoming.order-ready-search-in.commit-strategy=throttled
mp.messaging.incoming.order-ready-search-in.auto.offset.reset=earliest
mp.messaging.incoming.order-ready-search-in.failure-strategy=dead-letter-queue
mp.messaging.incoming.order-ready-search-in.fail-on-deserialization-failure=false
mp.messaging.incoming.order-ready-search-in.dead-letter-queue.topic=integration.order.ready.search.dlq.v2
mp.messaging.incoming.order-ready-search-in.dead-letter-queue.key.serializer=org.apache.kafka.common.serialization.StringSerializer
mp.messaging.incoming.order-ready-search-in.dead-letter-queue.value.serializer=io.quarkus.kafka.client.serialization.ObjectMapperSerializer
mp.messaging.outgoing.integration-events-out.connector=smallrye-kafka
mp.messaging.outgoing.integration-events-out.topic=${integration-hub.kafka.topics.order-received}
mp.messaging.outgoing.integration-events-out.key.serializer=org.apache.kafka.common.serialization.StringSerializer
mp.messaging.outgoing.integration-events-out.value.serializer=io.quarkus.kafka.client.serialization.ObjectMapperSerializer
mp.messaging.outgoing.integration-events-out.acks=all
mp.messaging.outgoing.integration-events-out.enable.idempotence=true
mp.messaging.outgoing.integration-events-out.request.timeout.ms=8000
mp.messaging.outgoing.integration-events-out.delivery.timeout.ms=10000
mp.messaging.outgoing.integration-events-out.wait-for-write-completion=true
integration-hub.kafka.publish-timeout=12s
%prod.kafka.bootstrap.servers=${KAFKA_BOOTSTRAP_SERVERS}

# OpenSearch projection
integration-hub.opensearch.url=http://localhost:9200
%prod.integration-hub.opensearch.url=${OPENSEARCH_URL}

# OpenAPI
quarkus.smallrye-openapi.info-title=Commerce Integration Hub API
quarkus.smallrye-openapi.info-description=Reliable commerce order ingestion and integration API.
quarkus.smallrye-openapi.path=/openapi/integration-core
quarkus.smallrye-openapi.operation-id-strategy=METHOD
quarkus.smallrye-openapi.auto-add-server=false
quarkus.smallrye-openapi.auto-add-security=false
quarkus.smallrye-openapi.store-schema-directory=src/main/resources/META-INF
quarkus.smallrye-openapi.store-schema-file-name=integration-core
quarkus.smallrye-openapi.ignore-static-document=true
mp.openapi.extensions.smallrye.remove-unused-schemas.enable=true

# Test coverage
%test.quarkus.jacoco.data-file=target/jacoco.exec
%test.quarkus.jacoco.reuse-data-file=true
%test.quarkus.jacoco.report-location=target/site/jacoco
%test.quarkus.jacoco.excludes=**/infrastructure/persistence/jooq/generated/**/*

# Swagger UI
quarkus.swagger-ui.always-include=true
quarkus.swagger-ui.path=/openapi-ui/integration-core
quarkus.swagger-ui.urls.integration-core=/openapi/integration-core
quarkus.swagger-ui.urls-primary-name=integration-core
